name: ask-the-docs

services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    # Ollama's default context window silently truncates long prompts. Override
    # from your shell or a project-level .env file (not .env.local).
    environment:
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:-8192}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: pulls the models into ollama's volume via its API, then exits.
  # ollama pull is idempotent, so re-running `compose up` later is a fast
  # no-op once the models are already present.
  ollama-init:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
      # Embeddings always run here (Anthropic has no embeddings API). Add chat models
      # for a local generator or judge, e.g. OLLAMA_PULL_MODELS="nomic-embed-text llama3.1:8b".
      - OLLAMA_PULL_MODELS=${OLLAMA_PULL_MODELS:-nomic-embed-text}
    entrypoint: ["sh", "-c", "for m in $$OLLAMA_PULL_MODELS; do ollama pull $$m || exit 1; done"]

  valkey:
    image: valkey/valkey
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222", "--store_dir", "/data"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    profiles: ["graph"]
    env_file:
      - .env.local
    environment:
      - NEO4J_PLUGINS=["graph-data-science"]
      - NEO4J_server_config_strict__validation_enabled=false
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    ports:
      - "127.0.0.1:7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30

  app:
    image: localhost/ask-the-docs-app
    build: .
    command: ["serve"]
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./evals:/app/evals
    env_file:
      - .env.local
    environment:
      # Listen on all interfaces inside the container so the published port
      # reaches it; the host side of the mapping is loopback only.
      - API_HOST=0.0.0.0
      - NATS_URL=nats://nats:4222
      # Read from the host shell; blank means the app falls back to GENERATOR__API_KEY.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - llm-observability

  worker:
    image: localhost/ask-the-docs-app
    build: .
    command: ["worker"]
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    env_file:
      - .env.local
    environment:
      - NATS_URL=nats://nats:4222
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - llm-observability

  web:
    image: localhost/ask-the-docs-web
    build: ./web
    environment:
      - BACKEND_URL=http://app:8000
      - OTEL_EXPORTER_ENDPOINT=http://otel-collector:4318/v1/traces
    ports:
      - "127.0.0.1:3000:3000"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - llm-observability

networks:
  default: {}
  llm-observability:
    external: true

volumes:
  ollama_data:
  valkey_data:
  nats_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
