services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: pulls the models into ollama's volume via its API, then exits.
  # ollama pull is idempotent, so re-running `compose up` later is a fast
  # no-op once the models are already present.
  ollama-init:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull llama3.1:8b && ollama pull nomic-embed-text"]

  app:
    build: .
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    volumes:
      - ./data:/app/data
      - ./evals:/app/evals
    env_file:
      - .env.local

volumes:
  ollama_data:
